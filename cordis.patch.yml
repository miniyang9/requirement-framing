# Opt-in requirement-framing filesystem Skill provider for DeepSeek Harness.
# Resolves the packaged Skill root from the installed npm identity anchored at
# the DSH profile (Loader baseUrl), never as a path concatenated onto baseUrl.
- insert:
    - id: requirement-framing-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: requirement-framing-plugin
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('requirement-framing-dsh/package.json')), 'skills')
